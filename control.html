<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SETTINGS BUTTON */
.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  z-index: 9999;
  cursor: pointer;
}

/* SCOREBOARD */
.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 12px;
}

.team-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
}

.team-name {
  font-weight: bold;
  font-size: 18px;
}

/* TEAM LOGOS */
.team-logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #222;
}

.team-score {
  font-size: 40px;
  font-weight: bold;
}

.team-shots {
  font-size: 20px;
  opacity: 0.9;
}

/* BUTTON FEEDBACK */
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.04s ease, opacity 0.04s ease;
}

button:active {
  transform: scale(0.90);
  opacity: 0.7;
}

/* CLOCK */
.clock-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  font-size: 18px;
  padding: 14px 0;
  margin: 0 4px;
  border-radius: 8px;
  border: none;
  background-color: #333;
  color: #fff;
}

#timer {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#period {
  font-size: 18px;
  text-align: center;
}

/* START BUTTON */
#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  color: white;
  background-color: #28a745;
  margin-bottom: 16px;
}

/* PULSE */
.pulse {
  animation: pulseAnim 1.2s infinite;
}

@keyframes pulseAnim {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* CONTROLS */
.team-controls {
  display: flex;
  justify-content: space-between;
  width: 95%;
  gap: 10px;
}

.team-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.team-column button.plus {
  font-size: 24px;
  padding: 40px 0;
  border-radius: 10px;
  border: none;
  background-color: #555;
  color: #fff;
}

.team-column button.minus {
  font-size: 24px;
  padding: 12px 0;
  border-radius: 10px;
  border: none;
  background-color: #777;
  color: #fff;
}

/* ANIMATIONS */
.score-pop {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.flash-green {
  animation: flashGreen 1s ease;
  font-weight: bold;
}

.flash-red {
  animation: flashRed 1s ease;
  font-weight: bold;
}

@keyframes flashGreen {
  0% { color: #fff; }
  40% { color: #28a745; }
  100% { color: #fff; }
}

@keyframes flashRed {
  0% { color: #fff; }
  40% { color: #dc3545; }
  100% { color: #fff; }
}

/* SETTINGS MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.modal-section {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.team-setup {
  flex: 1;
}

select, input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}

input:disabled {
  background-color: #444;
  color: #aaa;
}

.modal-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 10px;
}

.modal-buttons button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.update-btn { background-color: #28a745; color: #fff; }
.cancel-btn { background-color: #555; color: #fff; }
.reset-btn { background-color: #dc3545; color: #fff; }

/* ========================= */
/* PP OVERLAY (SAFE ADDITION) */
/* ========================= */

.pp-wrapper {
  position: relative;
  display: inline-block;
}

.pp-outline {
  outline: 3px solid yellow !important;
  outline-offset: 0px;
}

.pp-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: yellow;
  color: black;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 4px;
  border-radius: 4px;
  pointer-events: none;
}
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">

  <div class="team-row">

    <!-- TEAM A -->
    <div class="team-block">

      <div id="teamAName" class="team-name">Team A</div>

      <div class="pp-wrapper" id="wrapA">
        <img id="teamALogo" class="team-logo" src="">
      </div>

      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots" class="team-shots">Shots: 0</div>

    </div>

    <div style="font-size:32px; padding-top:90px;">-</div>

    <!-- TEAM B -->
    <div class="team-block">

      <div id="teamBName" class="team-name">Team B</div>

      <div class="pp-wrapper" id="wrapB">
        <img id="teamBLogo" class="team-logo" src="">
      </div>

      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots" class="team-shots">Shots: 0</div>

    </div>

  </div>
</div>

<div class="clock-section">
  <button onclick="setPeriod()">Period</button>

  <div style="flex:2;">
    <div id="timer">20:00</div>
    <div id="period">Period 1</div>
  </div>

  <button onclick="setClock()">Clock</button>
</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">

  <div class="team-column">
    <button class="plus" onclick="updateShots('A',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('A',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('A',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('A',-1)">-1 Goal</button>
  </div>

  <div class="team-column">
    <button class="plus" onclick="updateShots('B',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('B',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('B',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('B',-1)">-1 Goal</button>
  </div>

</div>

<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h2>Team Setup</h2>

    <div class="modal-section">
      <div class="team-setup">
        <h3>Team A</h3>
        <select id="teamADropdown" onchange="handleDropdownChange('A')"></select>
        <input id="teamACustom" type="text">
      </div>

      <div class="team-setup">
        <h3>Team B</h3>
        <select id="teamBDropdown" onchange="handleDropdownChange('B')"></select>
        <input id="teamBCustom" type="text">
      </div>
    </div>

    <div class="modal-buttons">
      <button class="update-btn" onclick="updateTeams()">Update</button>
      <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamAScore:0,
  teamAShots:0,
  teamALogo:"",
  teamBName:"Team B",
  teamBScore:0,
  teamBShots:0,
  teamBLogo:"",
  Period:1,
  TimerSeconds:1200,
  Running:false,

  // PP FLAGS
  teamA_pp:false,
  teamB_pp:false
};

let timerInterval;

/* INIT */
async function init(){
  try {
    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
    const data = await res.json();
    Object.assign(state,data);
  } catch(e){ console.error(e); }

  updateUI();
  loadTeamList();

  // logo click PP toggle
  document.getElementById("teamALogo").onclick = ()=>togglePP("A");
  document.getElementById("teamBLogo").onclick = ()=>togglePP("B");
}

init();

/* PP TOGGLE */
function togglePP(team){
  const key = team==="A" ? "teamA_pp" : "teamB_pp";
  state[key] = !state[key];
  pushUpdate(key, state[key]);
  updateUI();
}

/* PP RENDER */
function renderPP(){

  const aWrap = document.getElementById("wrapA");
  const bWrap = document.getElementById("wrapB");

  applyPP(aWrap, state.teamA_pp);
  applyPP(bWrap, state.teamB_pp);
}

function applyPP(wrap, active){

  const img = wrap.querySelector("img");

  wrap.classList.remove("pp-outline");
  const old = wrap.querySelector(".pp-badge");
  if(old) old.remove();

  if(active){
    wrap.classList.add("pp-outline");

    const badge = document.createElement("div");
    badge.className = "pp-badge";
    badge.textContent = "PP";
    wrap.appendChild(badge);
  }
}

/* UI */
function updateUI(){

  document.getElementById("teamAName").textContent = state.teamAName;
  document.getElementById("teamBName").textContent = state.teamBName;

  document.getElementById("teamAScore").textContent = state.teamAScore;
  document.getElementById("teamBScore").textContent = state.teamBScore;

  document.getElementById("teamAShots").textContent = "Shots: "+state.teamAShots;
  document.getElementById("teamBShots").textContent = "Shots: "+state.teamBShots;

  document.getElementById("teamALogo").src = state.teamALogo || "";
  document.getElementById("teamBLogo").src = state.teamBLogo || "";

  document.getElementById("timer").textContent =
    Math.floor(state.TimerSeconds/60)+":"+(state.TimerSeconds%60);

  document.getElementById("period").textContent = "Period "+state.Period;

  const btn = document.getElementById("startStopBtn");
  btn.textContent = state.Running ? "Stop":"Start";

  renderPP();
}

/* GOOGLE SYNC */
async function pushUpdate(field,value){
  await fetch(`${SCRIPT_URL}?update=true&field=${field}&value=${value}`);
}

/* PLACEHOLDER FUNCTIONS (UNCHANGED BASELINE EXPECTED BELOW) */
function toggleClock(){}
function setClock(){}
function setPeriod(){}
function updateScore(){}
function updateShots(){}
function loadTeamList(){}
function openSettings(){}
function closeSettings(){}
function updateTeams(){}
function resetGame(){}
function handleDropdownChange(){}
</script>

</body>
</html>
