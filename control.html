<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  z-index: 9999;
  cursor: pointer;
}

.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 12px;
}

.team-row {
  display: flex;
  justify-content: space-between;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.team-name { font-weight: bold; font-size: 18px; }

.team-logo {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 2px solid #fff;
  object-fit: cover;
}

.team-score { font-size: 40px; font-weight: bold; }
.team-shots { font-size: 20px; opacity: 0.9; }

.clock-section {
  display: flex;
  justify-content: space-between;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  margin: 0 4px;
  padding: 14px 0;
  background: #333;
  color: #fff;
  border: none;
  border-radius: 8px;
}

#timer { font-size: 28px; font-weight: bold; text-align: center; }
#period { text-align: center; }

#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  margin-bottom: 16px;
}

.team-controls {
  display: flex;
  width: 95%;
  gap: 10px;
}

.team-column { flex: 1; display: flex; flex-direction: column; gap: 6px; }

button { touch-action: manipulation; }

.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  inset: 0;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
}

.modal-section {
  display: flex;
  gap: 10px;
}

.team-setup { flex: 1; }

select, input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}

.modal-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
  gap: 6px;
}

.update-btn { background: #28a745; color: #fff; padding: 10px; border: none; }
.cancel-btn { background: #555; color: #fff; padding: 10px; border: none; }
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">
  <div class="team-row">
    <div class="team-block">
      <div id="teamAName">Team A</div>
      <img id="teamALogo" class="team-logo">
      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots">Shots: 0</div>
    </div>

    <div style="font-size:32px; padding-top:90px;">-</div>

    <div class="team-block">
      <div id="teamBName">Team B</div>
      <img id="teamBLogo" class="team-logo">
      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots">Shots: 0</div>
    </div>
  </div>
</div>

<div class="clock-section">
  <button onclick="setPeriod()">Period</button>

  <div>
    <div id="timer">15:00</div>
    <div id="period">Period 1</div>
  </div>

  <button onclick="setClock()">Clock</button>
</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">
  <div class="team-column">
    <button onclick="updateShots('A',1)">+ Shot</button>
    <button onclick="updateShots('A',-1)">- Shot</button>
    <button onclick="updateScore('A',1)">+ Goal</button>
    <button onclick="updateScore('A',-1)">- Goal</button>
  </div>

  <div class="team-column">
    <button onclick="updateShots('B',1)">+ Shot</button>
    <button onclick="updateShots('B',-1)">- Shot</button>
    <button onclick="updateScore('B',1)">+ Goal</button>
    <button onclick="updateScore('B',-1)">- Goal</button>
  </div>
</div>

<!-- MODAL -->
<div id="settingsModal" class="modal">
  <div class="modal-content">

    <h2>Team Setup</h2>

    <div class="modal-section">
      <div class="team-setup">
        <h3>Team A</h3>
        <select id="teamADropdown" onchange="handleDropdownChange('A')"></select>
        <input id="teamACustom">
      </div>

      <div class="team-setup">
        <h3>Team B</h3>
        <select id="teamBDropdown" onchange="handleDropdownChange('B')"></select>
        <input id="teamBCustom">
      </div>
    </div>

    <div class="modal-buttons">
      <button class="update-btn" onclick="updateTeams()">Update</button>
      <button class="cancel-btn" onclick="closeSettings()">Close</button>
      <button class="cancel-btn" onclick="resetGame()">Reset</button>
    </div>

  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamBName:"Team B",
  teamAScore:0,
  teamBScore:0,
  teamAShots:0,
  teamBShots:0,
  Period:1,
  TimerSeconds:900,
  Running:false
};

let timerInterval;

/* ========= CORE REFRESH ========= */
async function refreshApp(){
  try {
    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
    const data = await res.json();
    Object.assign(state, data);
    updateUI();
    await loadTeamList();
  } catch(e){
    console.error("refresh failed", e);
  }
}

/* ========= SETTINGS ========= */
function openSettings(){ document.getElementById("settingsModal").style.display="flex"; }
function closeSettings(){ document.getElementById("settingsModal").style.display="none"; }

/* ========= TEAM LIST ========= */
async function loadTeamList(){
  try {
    const res = await fetch(`${SCRIPT_URL}?list=true&t=${Date.now()}`);
    const list = await res.json();
    const unique = [...new Set(list)];

    ["A","B"].forEach(t=>{
      const dd = document.getElementById(`team${t}Dropdown`);
      dd.innerHTML="";

      const custom = document.createElement("option");
      custom.value="__custom__";
      custom.textContent="Custom";
      dd.appendChild(custom);

      unique.forEach(n=>{
        const opt=document.createElement("option");
        opt.value=n;
        opt.textContent=n;
        dd.appendChild(opt);
      });
    });

  } catch(e){ console.error(e); }
}

/* ========= UPDATE TEAMS (FIXED) ========= */
async function updateTeams(){

  const updates = [];

  ["A","B"].forEach(t=>{
    const dd=document.getElementById(`team${t}Dropdown`);
    const input=document.getElementById(`team${t}Custom`);

    const name = dd.value==="__custom__" ? input.value.trim() : dd.value;
    if(!name) return;

    const field = t==="A" ? "teamAName" : "teamBName";
    state[field]=name;

    updates.push(pushUpdate(field,name));
  });

  await Promise.all(updates);

  updateUI();
  closeSettings();

  setTimeout(()=>refreshApp(),150);
}

/* ========= RESET GAME ========= */
async function resetGame(){

  if(!confirm("Reset everything?")) return;

  stopTimer();

  state.teamAScore=0;
  state.teamBScore=0;
  state.teamAShots=0;
  state.teamBShots=0;
  state.Period=1;
  state.TimerSeconds=900;
  state.Running=false;

  await Promise.all([
    pushUpdate("teamAScore",0),
    pushUpdate("teamBScore",0),
    pushUpdate("teamAShots",0),
    pushUpdate("teamBShots",0),
    pushUpdate("Period",1),
    pushUpdate("TimerSeconds",900),
    pushUpdate("Running",false)
  ]);

  updateUI();
  setTimeout(()=>refreshApp(),150);
}

/* ========= PUSH ========= */
async function pushUpdate(field,value){
  return fetch(`${SCRIPT_URL}?update=true&field=${field}&value=${encodeURIComponent(value)}`);
}

/* ========= UI ========= */
function updateUI(){

  document.getElementById("teamAName").textContent=state.teamAName;
  document.getElementById("teamBName").textContent=state.teamBName;

  document.getElementById("teamAScore").textContent=state.teamAScore;
  document.getElementById("teamBScore").textContent=state.teamBScore;

  document.getElementById("teamAShots").textContent=`Shots: ${state.teamAShots}`;
  document.getElementById("teamBShots").textContent=`Shots: ${state.teamBShots}`;

  document.getElementById("timer").textContent=format(state.TimerSeconds);
  document.getElementById("period").textContent=`Period ${state.Period}`;
}

function format(s){
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

/* ========= CLOCK ========= */
function toggleClock(){
  state.Running=!state.Running;
  if(state.Running) startTimer(); else stopTimer();
  pushUpdate("Running",state.Running);
  updateUI();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(state.TimerSeconds>0){
      state.TimerSeconds--;
      pushUpdate("TimerSeconds",state.TimerSeconds);
      updateUI();
    }
  },1000);
}

function stopTimer(){ clearInterval(timerInterval); }

/* ========= SCORE ========= */
function updateScore(t,c){
  const key=t==="A"?"teamAScore":"teamBScore";
  state[key]=Math.max(0,state[key]+c);
  pushUpdate(key,state[key]);
  updateUI();
}

function updateShots(t,c){
  const key=t==="A"?"teamAShots":"teamBShots";
  state[key]=Math.max(0,state[key]+c);
  pushUpdate(key,state[key]);
  updateUI();
}

/* ========= CONTROLS ========= */
function setClock(){
  const v=prompt("MM:SS");
  if(!v||!v.includes(":"))return;
  const [m,s]=v.split(":").map(Number);
  state.TimerSeconds=m*60+s;
  pushUpdate("TimerSeconds",state.TimerSeconds);
  updateUI();
}

function setPeriod(){
  const v=parseInt(prompt("Period"));
  if(!isNaN(v)){
    state.Period=v;
    pushUpdate("Period",v);
    updateUI();
  }
}

/* ========= INIT ========= */
async function init(){
  await refreshApp();
}
init();

</script>
</body>
</html>
