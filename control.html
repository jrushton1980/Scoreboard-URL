<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SETTINGS BUTTON */
.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  z-index: 9999;
  cursor: pointer;
}

/* SCOREBOARD */
.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 12px;
}

.team-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
}

.team-name {
  font-weight: bold;
  font-size: 18px;
}

/* LOGO WRAPPER (NEW FOR PP FLAG) */
.logo-wrap {
  position: relative;
  display: inline-block;
}

/* TEAM LOGOS */
.team-logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #222;
  cursor: pointer;
}

/* PP ACTIVE STATE */
.team-logo.pp-active {
  border: 2px solid #ffd700;
  box-shadow: 0 0 10px #ffd700;
}

/* PP FLAG */
.pp-flag {
  position: absolute;
  top: -6px;
  right: -6px;
  background: #ffd700;
  color: #000;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 5px;
  border-radius: 4px;
  display: none;
}

/* SHOW FLAG WHEN ACTIVE */
.logo-wrap.pp-active .pp-flag {
  display: block;
}

.team-score {
  font-size: 40px;
  font-weight: bold;
}

.team-shots {
  font-size: 20px;
  opacity: 0.9;
}

/* BUTTON FEEDBACK */
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.04s ease, opacity 0.04s ease;
}

button:active {
  transform: scale(0.90);
  opacity: 0.7;
}

/* CLOCK */
.clock-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  font-size: 18px;
  padding: 14px 0;
  margin: 0 4px;
  border-radius: 8px;
  border: none;
  background-color: #333;
  color: #fff;
}

#timer {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#period {
  font-size: 18px;
  text-align: center;
}

/* START BUTTON */
#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  color: white;
  background-color: #28a745;
  margin-bottom: 16px;
}

/* PULSE */
.pulse {
  animation: pulseAnim 1.2s infinite;
}

@keyframes pulseAnim {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* CONTROLS */
.team-controls {
  display: flex;
  justify-content: space-between;
  width: 95%;
  gap: 10px;
}

.team-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.team-column button.plus {
  font-size: 24px;
  padding: 40px 0;
  border-radius: 10px;
  border: none;
  background-color: #555;
  color: #fff;
}

.team-column button.minus {
  font-size: 24px;
  padding: 12px 0;
  border-radius: 10px;
  border: none;
  background-color: #777;
  color: #fff;
}

/* ANIMATIONS */
.score-pop {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.flash-green {
  animation: flashGreen 1s ease;
  font-weight: bold;
}

.flash-red {
  animation: flashRed 1s ease;
  font-weight: bold;
}

@keyframes flashGreen {
  0% { color: #fff; }
  40% { color: #28a745; }
  100% { color: #fff; }
}

@keyframes flashRed {
  0% { color: #fff; }
  40% { color: #dc3545; }
  100% { color: #fff; }
}

/* SETTINGS MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.modal-section {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.team-setup {
  flex: 1;
}

select, input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}

input:disabled {
  background-color: #444;
  color: #aaa;
}

.modal-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 10px;
}

.modal-buttons button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.update-btn { background:#28a745; color:#fff; }
.cancel-btn { background:#555; color:#fff; }
.reset-btn { background:#dc3545; color:#fff; }
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">

  <div class="team-row">

    <!-- TEAM A -->
    <div class="team-block">

      <div id="teamAName" class="team-name">Team A</div>

      <div class="logo-wrap" id="teamALogoWrap">
        <img id="teamALogo" class="team-logo" src="" onclick="togglePP('A')">
        <div class="pp-flag">PP</div>
      </div>

      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots" class="team-shots">Shots: 0</div>

    </div>

    <div style="font-size:32px; padding-top:90px;">-</div>

    <!-- TEAM B -->
    <div class="team-block">

      <div id="teamBName" class="team-name">Team B</div>

      <div class="logo-wrap" id="teamBLogoWrap">
        <img id="teamBLogo" class="team-logo" src="" onclick="togglePP('B')">
        <div class="pp-flag">PP</div>
      </div>

      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots" class="team-shots">Shots: 0</div>

    </div>

  </div>
</div>

<div class="clock-section">

  <button onclick="setPeriod()">Period</button>

  <div style="flex:2;">
    <div id="timer">20:00</div>
    <div id="period">Period 1</div>
  </div>

  <button onclick="setClock()">Clock</button>

</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">

  <div class="team-column">
    <button class="plus" onclick="updateShots('A',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('A',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('A',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('A',-1)">-1 Goal</button>
  </div>

  <div class="team-column">
    <button class="plus" onclick="updateShots('B',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('B',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('B',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('B',-1)">-1 Goal</button>
  </div>

</div>

<!-- SETTINGS MODAL (UNCHANGED) -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h2>Team Setup</h2>

    <div class="modal-section">
      <div class="team-setup">
        <h3>Team A</h3>
        <select id="teamADropdown" onchange="handleDropdownChange('A')"></select>
        <input id="teamACustom" type="text">
      </div>

      <div class="team-setup">
        <h3>Team B</h3>
        <select id="teamBDropdown" onchange="handleDropdownChange('B')"></select>
        <input id="teamBCustom" type="text">
      </div>
    </div>

    <div class="modal-buttons">
      <button class="update-btn" onclick="updateTeams()">Update</button>
      <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamAScore:0,
  teamAShots:0,
  teamALogo:"",
  teamAPP:false,

  teamBName:"Team B",
  teamBScore:0,
  teamBShots:0,
  teamBLogo:"",
  teamBPP:false,

  Period:1,
  TimerSeconds:900,
  Running:false
};

let timerInterval;

/* PP TOGGLE (NEW) */
function togglePP(team){

  const key = team === "A" ? "teamAPP" : "teamBPP";
  state[key] = !state[key];

  pushUpdate(key, state[key]);

  updateUI();
}

/* SETTINGS */
function openSettings(){ document.getElementById("settingsModal").style.display="flex"; }
function closeSettings(){ document.getElementById("settingsModal").style.display="none"; }

/* (ALL YOUR EXISTING FUNCTIONS UNCHANGED BELOW) */

function updateUI(){

  document.getElementById('teamAName').textContent = state.teamAName;
  document.getElementById('teamBName').textContent = state.teamBName;

  document.getElementById('teamAScore').textContent = state.teamAScore;
  document.getElementById('teamBScore').textContent = state.teamBScore;

  document.getElementById('teamAShots').textContent = `Shots: ${state.teamAShots}`;
  document.getElementById('teamBShots').textContent = `Shots: ${state.teamBShots}`;

  document.getElementById('teamALogo').src = state.teamALogo || "";
  document.getElementById('teamBLogo').src = state.teamBLogo || "";

  /* PP VISUAL */
  applyPP("A");
  applyPP("B");

  document.getElementById('timer').textContent = formatTime(state.TimerSeconds);
  document.getElementById('period').textContent = `Period ${state.Period}`;

  const btn = document.getElementById('startStopBtn');
  btn.textContent = state.Running ? "Stop" : "Start";
  btn.style.backgroundColor = state.Running ? "#dc3545" : "#28a745";
  btn.classList.toggle("pulse", state.Running);
}

function applyPP(team){

  const wrap = document.getElementById(team==="A" ? "teamALogoWrap":"teamBLogoWrap");
  const img  = document.getElementById(team==="A" ? "teamALogo":"teamBLogo");
  const flag = wrap.querySelector(".pp-flag");

  const active = team==="A" ? state.teamAPP : state.teamBPP;

  wrap.classList.toggle("pp-active", active);
  img.classList.toggle("pp-active", active);
  flag.style.display = active ? "block" : "none";
}

/* EVERYTHING ELSE BELOW REMAINS YOUR ORIGINAL LOGIC */
function formatTime(sec){ return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`; }

function toggleClock(){
  state.Running=!state.Running;
  state.Running ? startTimer() : stopTimer();
  updateUI();
  pushUpdate("Running",state.Running);
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(state.TimerSeconds>0){
      state.TimerSeconds--;
      document.getElementById("timer").textContent=formatTime(state.TimerSeconds);
      pushUpdate("TimerSeconds",state.TimerSeconds);
    }
  },1000);
}

function stopTimer(){ clearInterval(timerInterval); }

function updateScore(team,change){
  const key=team==="A"?"teamAScore":"teamBScore";
  state[key]=Math.max(0,state[key]+change);
  updateUI();
  pushUpdate(key,state[key]);
}

function updateShots(team,change){
  const key=team==="A"?"teamAShots":"teamBShots";
  state[key]=Math.max(0,state[key]+change);
  updateUI();
  pushUpdate(key,state[key]);
}

async function pushUpdate(field,value){
  await fetch(`${SCRIPT_URL}?update=true&field=${field}&value=${encodeURIComponent(value)}`);
}

function init(){ fetch(`${SCRIPT_URL}?t=${Date.now()}`).then(r=>r.json()).then(d=>Object.assign(state,d)).finally(updateUI); }
init();

</script>
</body>
</html>
