<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  z-index: 9999;
  cursor: pointer;
}

.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 12px;
}

.team-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
}

.team-name {
  font-weight: bold;
  font-size: 18px;
}

/* LOGO BASE */
.team-logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #222;
  position: relative;
}

/* PP STATE */
.team-logo.pp-active {
  border: 3px solid yellow;
  box-shadow: 0 0 10px yellow;
}

/* PP BADGE */
.pp-badge {
  position: absolute;
  top: 0;
  right: 0;
  background: yellow;
  color: black;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 4px;
  border-radius: 6px;
  transform: translate(20%, -20%);
}

.logo-wrap {
  position: relative;
  display: inline-block;
}

.team-score {
  font-size: 40px;
  font-weight: bold;
}

.team-shots {
  font-size: 20px;
  opacity: 0.9;
}

button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.04s ease, opacity 0.04s ease;
}

button:active {
  transform: scale(0.90);
  opacity: 0.7;
}

.clock-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  font-size: 18px;
  padding: 14px 0;
  margin: 0 4px;
  border-radius: 8px;
  border: none;
  background-color: #333;
  color: #fff;
}

#timer {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#period {
  font-size: 18px;
  text-align: center;
}

#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  color: white;
  background-color: #28a745;
  margin-bottom: 16px;
}

.team-controls {
  display: flex;
  justify-content: space-between;
  width: 95%;
  gap: 10px;
}

.team-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.team-column button.plus {
  font-size: 24px;
  padding: 40px 0;
  border-radius: 10px;
  border: none;
  background-color: #555;
  color: #fff;
}

.team-column button.minus {
  font-size: 24px;
  padding: 12px 0;
  border-radius: 10px;
  border: none;
  background-color: #777;
  color: #fff;
}
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">

  <div class="team-row">

    <!-- TEAM A -->
    <div class="team-block">
      <div id="teamAName" class="team-name">Team A</div>

      <div class="logo-wrap">
        <img id="teamALogo" class="team-logo" onclick="togglePP('A')">
        <div id="ppA" class="pp-badge" style="display:none;">PP</div>
      </div>

      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots" class="team-shots">Shots: 0</div>
    </div>

    <div style="font-size:32px; padding-top:90px;">-</div>

    <!-- TEAM B -->
    <div class="team-block">
      <div id="teamBName" class="team-name">Team B</div>

      <div class="logo-wrap">
        <img id="teamBLogo" class="team-logo" onclick="togglePP('B')">
        <div id="ppB" class="pp-badge" style="display:none;">PP</div>
      </div>

      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots" class="team-shots">Shots: 0</div>
    </div>

  </div>
</div>

<div class="clock-section">
  <button onclick="setPeriod()">Period</button>
  <div style="flex:2;">
    <div id="timer">20:00</div>
    <div id="period">Period 1</div>
  </div>
  <button onclick="setClock()">Clock</button>
</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">

  <div class="team-column">
    <button class="plus" onclick="updateShots('A',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('A',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('A',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('A',-1)">-1 Goal</button>
  </div>

  <div class="team-column">
    <button class="plus" onclick="updateShots('B',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('B',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('B',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('B',-1)">-1 Goal</button>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamAScore:0,
  teamAShots:0,
  teamALogo:"",
  teamBName:"Team B",
  teamBScore:0,
  teamBShots:0,
  teamBLogo:"",
  Period:1,
  TimerSeconds:1200,
  Running:false,
  teamA_pp:false,
  teamB_pp:false
};

let timerInterval;

/* ===== PP TOGGLE ===== */
function togglePP(team){

  const key = team === "A" ? "teamA_pp" : "teamB_pp";

  state[key] = !state[key];

  renderPP();

  pushUpdate(key, state[key]);
}

/* VISUAL PP */
function renderPP(){

  const a = state.teamA_pp;
  const b = state.teamB_pp;

  document.getElementById("teamALogo").classList.toggle("pp-active", a);
  document.getElementById("teamBLogo").classList.toggle("pp-active", b);

  document.getElementById("ppA").style.display = a ? "block" : "none";
  document.getElementById("ppB").style.display = b ? "block" : "none";
}

/* KEEP EVERYTHING ELSE SAME */
function openSettings(){ document.getElementById("settingsModal").style.display="flex"; }
function closeSettings(){ document.getElementById("settingsModal").style.display="none"; }

function toggleClock(){
  state.Running = !state.Running;
  updateUI();
  pushUpdate("Running", state.Running);
}

function updateScore(team,change){
  const key = team==="A" ? "teamAScore":"teamBScore";
  state[key] = Math.max(0,state[key]+change);
  updateUI();
  pushUpdate(key,state[key]);
}

function updateShots(team,change){
  const key = team==="A" ? "teamAShots":"teamBShots";
  state[key] = Math.max(0,state[key]+change);
  updateUI();
  pushUpdate(key,state[key]);
}

function updateUI(){
  document.getElementById("teamAName").textContent = state.teamAName;
  document.getElementById("teamBName").textContent = state.teamBName;
  document.getElementById("teamAScore").textContent = state.teamAScore;
  document.getElementById("teamBScore").textContent = state.teamBScore;
  document.getElementById("teamAShots").textContent = "Shots: " + state.teamAShots;
  document.getElementById("teamBShots").textContent = "Shots: " + state.teamBShots;
  renderPP();
}

async function pushUpdate(field,value){
  fetch(`${SCRIPT_URL}?update=true&field=${field}&value=${encodeURIComponent(value)}`);
}

async function init(){
  try{
    const res = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
    const data = await res.json();
    Object.assign(state,data);
  }catch(e){}
  updateUI();
}

init();

/* IMPORTANT FIX */
Object.assign(window,{
  toggleClock,
  updateScore,
  updateShots,
  openSettings,
  closeSettings,
  togglePP
});
</script>

</body>
</html>
