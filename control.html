<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* SETTINGS BUTTON */
.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  color: #fff;
  font-size: 28px;
  z-index: 9999;
  cursor: pointer;
}

/* SCOREBOARD */
.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 12px 10px;
  margin-bottom: 12px;
}

.team-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-align: center;
  position: relative;
}

.team-name {
  font-weight: bold;
  font-size: 18px;
}

/* TEAM LOGOS */
.team-logo {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #fff;
  background: #222;
}

/* 🟡 PP ACTIVE EFFECT */
.team-logo.pp-active {
  border-color: #ffd400;
  box-shadow: 0 0 10px #ffd400;
}

/* PP BADGE */
.pp-badge {
  position: absolute;
  top: 35px;
  right: 25px;
  background: #ffd400;
  color: #000;
  font-size: 10px;
  font-weight: bold;
  padding: 3px 5px;
  border-radius: 4px;
  display: none;
}

/* SCORE */
.team-score {
  font-size: 40px;
  font-weight: bold;
}

.team-shots {
  font-size: 20px;
  opacity: 0.9;
}

/* BUTTON FEEDBACK */
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: transform 0.04s ease, opacity 0.04s ease;
}

button:active {
  transform: scale(0.90);
  opacity: 0.7;
}

/* CLOCK */
.clock-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  font-size: 18px;
  padding: 14px 0;
  margin: 0 4px;
  border-radius: 8px;
  border: none;
  background-color: #333;
  color: #fff;
}

#timer {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#period {
  font-size: 18px;
  text-align: center;
}

/* START BUTTON */
#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  color: white;
  background-color: #28a745;
  margin-bottom: 16px;
}

/* PULSE */
.pulse {
  animation: pulseAnim 1.2s infinite;
}

@keyframes pulseAnim {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* CONTROLS */
.team-controls {
  display: flex;
  justify-content: space-between;
  width: 95%;
  gap: 10px;
}

.team-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.team-column button.plus {
  font-size: 24px;
  padding: 40px 0;
  border-radius: 10px;
  border: none;
  background-color: #555;
  color: #fff;
}

.team-column button.minus {
  font-size: 24px;
  padding: 12px 0;
  border-radius: 10px;
  border: none;
  background-color: #777;
  color: #fff;
}

/* ANIMATIONS */
.score-pop {
  animation: pop 0.25s ease;
}

@keyframes pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.4); }
  100% { transform: scale(1); }
}

.flash-green {
  animation: flashGreen 1s ease;
  font-weight: bold;
}

.flash-red {
  animation: flashRed 1s ease;
  font-weight: bold;
}

@keyframes flashGreen {
  0% { color: #fff; }
  40% { color: #28a745; }
  100% { color: #fff; }
}

@keyframes flashRed {
  0% { color: #fff; }
  40% { color: #dc3545; }
  100% { color: #fff; }
}

/* SETTINGS MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 10000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

.modal-section {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.team-setup {
  flex: 1;
}

select, input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}

input:disabled {
  background-color: #444;
  color: #aaa;
}

.modal-buttons {
  margin-top: 20px;
  display: flex;
  justify-content: space-around;
}

.modal-buttons button {
  padding: 10px 20px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
}

.update-btn {
  background-color: #28a745;
  color: #fff;
}

.cancel-btn {
  background-color: #555;
  color: #fff;
}
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">
  <div class="team-row">

    <!-- TEAM A -->
    <div class="team-block">
      <div id="teamAName" class="team-name">Team A</div>

      <div style="position:relative;">
        <img id="teamALogo" class="team-logo" src="">
        <div id="ppA" class="pp-badge">PP</div>
      </div>

      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots" class="team-shots">Shots: 0</div>
    </div>

    <div style="font-size:32px; padding-top:90px;">-</div>

    <!-- TEAM B -->
    <div class="team-block">
      <div id="teamBName" class="team-name">Team B</div>

      <div style="position:relative;">
        <img id="teamBLogo" class="team-logo" src="">
        <div id="ppB" class="pp-badge">PP</div>
      </div>

      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots" class="team-shots">Shots: 0</div>
    </div>

  </div>
</div>

<div class="clock-section">
  <button onclick="setPeriod()">Period</button>

  <div style="flex:2;">
    <div id="timer">20:00</div>
    <div id="period">Period 1</div>
  </div>

  <button onclick="setClock()">Clock</button>
</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">

  <div class="team-column">
    <button class="plus" onclick="updateShots('A',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('A',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('A',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('A',-1)">-1 Goal</button>
  </div>

  <div class="team-column">
    <button class="plus" onclick="updateShots('B',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('B',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('B',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('B',-1)">-1 Goal</button>
  </div>

</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal">
  <div class="modal-content">

    <h2>Team Setup</h2>

    <button onclick="togglePP()" class="update-btn" style="margin-bottom:10px;">
      Toggle PP
    </button>

    <div class="modal-section">

      <div class="team-setup">
        <h3>Team A</h3>
        <select id="teamADropdown" onchange="handleDropdownChange('A')"></select>
        <input id="teamACustom" type="text">
      </div>

      <div class="team-setup">
        <h3>Team B</h3>
        <select id="teamBDropdown" onchange="handleDropdownChange('B')"></select>
        <input id="teamBCustom" type="text">
      </div>

    </div>

    <div class="modal-buttons">
      <button class="update-btn" onclick="updateTeams()">Update</button>
      <button class="cancel-btn" onclick="closeSettings()">Cancel</button>
      <button class="cancel-btn" onclick="resetGame()">Reset Game</button>
    </div>

  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamAScore:0,
  teamAShots:0,
  teamALogo:"",
  teamBName:"Team B",
  teamBScore:0,
  teamBShots:0,
  teamBLogo:"",
  Period:1,
  TimerSeconds:1200,
  Running:false,
  PP:false
};

let timerInterval;

/* SETTINGS */
function openSettings(){ document.getElementById("settingsModal").style.display="flex"; }
function closeSettings(){ document.getElementById("settingsModal").style.display="none"; }

/* PP TOGGLE */
function togglePP(){
  state.PP = !state.PP;

  ["A","B"].forEach(t=>{
    const logo = document.getElementById(`team${t}Logo`);
    const badge = document.getElementById(`pp${t}`);

    logo.classList.toggle("pp-active", state.PP);
    badge.style.display = state.PP ? "block" : "none";
  });

  pushUpdate("PP", state.PP);
}

/* RESET */
function resetGame(){
  state.teamAScore = 0;
  state.teamBScore = 0;
  state.teamAShots = 0;
  state.teamBShots = 0;
  state.Period = 1;
  state.TimerSeconds = 1200;
  state.Running = false;

  updateUI();

  pushUpdate("teamAScore",0);
  pushUpdate("teamBScore",0);
  pushUpdate("teamAShots",0);
  pushUpdate("teamBShots",0);
  pushUpdate("Period",1);
  pushUpdate("TimerSeconds",1200);
  pushUpdate("Running",false);

  closeSettings();
}

/* EVERYTHING ELSE UNCHANGED BELOW */

function updateUI(){
  document.getElementById('teamAName').textContent = state.teamAName;
  document.getElementById('teamBName').textContent = state.teamBName;

  document.getElementById('teamAScore').textContent = state.teamAScore;
  document.getElementById('teamBScore').textContent = state.teamBScore;

  document.getElementById('teamAShots').textContent = `Shots: ${state.teamAShots}`;
  document.getElementById('teamBShots').textContent = `Shots: ${state.teamBShots}`;

  document.getElementById('teamALogo').src = state.teamALogo || "";
  document.getElementById('teamBLogo').src = state.teamBLogo || "";

  document.getElementById('timer').textContent = formatTime(state.TimerSeconds);
  document.getElementById('period').textContent = `Period ${state.Period}`;

  const btn = document.getElementById('startStopBtn');
  btn.textContent = state.Running ? "Stop" : "Start";
  btn.style.backgroundColor = state.Running ? "#dc3545" : "#28a745";
  btn.classList.toggle("pulse", state.Running);
}

function formatTime(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function toggleClock(){
  state.Running = !state.Running;
  state.Running ? startTimer() : stopTimer();
  updateUI();
  pushUpdate("Running",state.Running);
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(state.TimerSeconds>0){
      state.TimerSeconds--;
      document.getElementById('timer').textContent = formatTime(state.TimerSeconds);
      pushUpdate("TimerSeconds",state.TimerSeconds);
    }
  },1000);
}

function stopTimer(){ clearInterval(timerInterval); }

function setClock(){ const i=prompt("MM:SS"); if(i){const [m,s]=i.split(":"); state.TimerSeconds=m*60+ +s; updateUI(); pushUpdate("TimerSeconds",state.TimerSeconds);} }

function setPeriod(){ const v=parseInt(prompt("Period")); if(v){state.Period=v; updateUI(); pushUpdate("Period",v);} }

function updateScore(t,c){
  const k=t==="A"?"teamAScore":"teamBScore";
  state[k]=Math.max(0,state[k]+c);
  updateUI();
  pushUpdate(k,state[k]);
}

function updateShots(t,c){
  const k=t==="A"?"teamAShots":"teamBShots";
  state[k]=Math.max(0,state[k]+c);
  updateUI();
  pushUpdate(k,state[k]);
}

async function pushUpdate(f,v){
  await fetch(`${SCRIPT_URL}?update=true&field=${f}&value=${encodeURIComponent(v)}`);
}

async function init(){
  const r=await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
  Object.assign(state,await r.json());
  updateUI();
}

init();
</script>

</body>
</html>
