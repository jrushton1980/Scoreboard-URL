<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scoreboard Control</title>

<style>
body {
  background-color: #111;
  color: #fff;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.scoreboard {
  width: 95%;
  background: #1e1e1e;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
  text-align: center;
}

/* TEAM STACK (CENTERED + LOGOS) */
.team-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.team-block {
  width: 45%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  text-align: center;
}

.team-logo {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #fff;
  background: #222;
}

.team-name {
  font-weight: bold;
  font-size: 18px;
}

.team-score {
  font-size: 40px;
  font-weight: bold;
}

.shots-row {
  display: flex;
  justify-content: space-between;
  font-size: 20px;
  margin-top: 4px;
  opacity: 0.9;
}

/* BUTTONS */
button {
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.05s ease, opacity 0.05s ease;
}

button:active {
  transform: scale(0.92);
  opacity: 0.7;
}

/* CLOCK */
.clock-section {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 95%;
  background: #1d1d1d;
  border-radius: 12px;
  padding: 10px;
  margin-bottom: 12px;
}

.clock-section button {
  flex: 1;
  font-size: 18px;
  padding: 14px 0;
  margin: 0 4px;
  border-radius: 8px;
  border: none;
  background-color: #333;
  color: #fff;
}

#timer {
  font-size: 28px;
  font-weight: bold;
  text-align: center;
}

#period {
  font-size: 18px;
  text-align: center;
}

#startStopBtn {
  width: 95%;
  font-size: 28px;
  padding: 40px 0;
  border-radius: 12px;
  border: none;
  color: white;
  background-color: #28a745;
  margin-bottom: 16px;
}

/* CONTROLS */
.team-controls {
  display: flex;
  justify-content: space-between;
  width: 95%;
  gap: 10px;
}

.team-column {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.plus {
  font-size: 24px;
  padding: 40px 0;
  background: #555;
  border: none;
  color: white;
  border-radius: 10px;
}

.minus {
  font-size: 24px;
  padding: 12px 0;
  background: #777;
  border: none;
  color: white;
  border-radius: 10px;
}

/* SETTINGS */
.settings-btn {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: none;
  border: none;
  font-size: 28px;
  color: white;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.8);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 500px;
  text-align: center;
}

select, input {
  width: 100%;
  padding: 8px;
  margin-top: 6px;
  border-radius: 6px;
  border: none;
}

.modal-buttons {
  margin-top: 20px;
}
</style>
</head>

<body>

<button class="settings-btn" onclick="openSettings()">⚙️</button>

<div class="scoreboard">
  <div class="team-row">

    <div class="team-block">
      <img id="teamALogo" class="team-logo">
      <div id="teamAName" class="team-name">Team A</div>
      <div id="teamAScore" class="team-score">0</div>
      <div id="teamAShots">Shots: 0</div>
    </div>

    <div style="font-size:32px;">-</div>

    <div class="team-block">
      <img id="teamBLogo" class="team-logo">
      <div id="teamBName" class="team-name">Team B</div>
      <div id="teamBScore" class="team-score">0</div>
      <div id="teamBShots">Shots: 0</div>
    </div>

  </div>
</div>

<div class="clock-section">
  <button onclick="setPeriod()">Period</button>

  <div style="flex:2;">
    <div id="timer">20:00</div>
    <div id="period">Period 1</div>
  </div>

  <button onclick="setClock()">Clock</button>
</div>

<button id="startStopBtn" onclick="toggleClock()">Start</button>

<div class="team-controls">

  <div class="team-column">
    <button class="plus" onclick="updateShots('A',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('A',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('A',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('A',-1)">-1 Goal</button>
  </div>

  <div class="team-column">
    <button class="plus" onclick="updateShots('B',1)">+1 Shot</button>
    <button class="minus" onclick="updateShots('B',-1)">-1 Shot</button>
    <button class="plus" onclick="updateScore('B',1)">+1 Goal</button>
    <button class="minus" onclick="updateScore('B',-1)">-1 Goal</button>
  </div>

</div>

<!-- SETTINGS -->
<div id="settingsModal" class="modal">
  <div class="modal-content">

    <h3>Team Setup</h3>

    <div>
      <h4>Team A</h4>
      <select id="teamADropdown" onchange="handleDrop('A')"></select>
      <input id="teamACustom">
    </div>

    <div>
      <h4>Team B</h4>
      <select id="teamBDropdown" onchange="handleDrop('B')"></select>
      <input id="teamBCustom">
    </div>

    <div class="modal-buttons">
      <button onclick="updateTeams()">Update</button>
      <button onclick="closeSettings()">Cancel</button>
    </div>

  </div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let state = {
  teamAName:"Team A",
  teamBName:"Team B",
  teamAScore:0,
  teamBScore:0,
  teamAShots:0,
  teamBShots:0,
  teamALogo:"",
  teamBLogo:"",
  Period:1,
  TimerSeconds:1200,
  Running:false
};

let timerInterval;

/* INIT */
async function init(){
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    Object.assign(state,data);
  } catch(e){}
  updateUI();
}

/* UI */
function updateUI(){

  document.getElementById("teamAName").textContent = state.teamAName;
  document.getElementById("teamBName").textContent = state.teamBName;

  document.getElementById("teamAScore").textContent = state.teamAScore;
  document.getElementById("teamBScore").textContent = state.teamBScore;

  document.getElementById("teamAShots").textContent = "Shots: " + state.teamAShots;
  document.getElementById("teamBShots").textContent = "Shots: " + state.teamBShots;

  document.getElementById("teamALogo").src = state.teamALogo || "";
  document.getElementById("teamBLogo").src = state.teamBLogo || "";

  document.getElementById("timer").textContent = formatTime(state.TimerSeconds);
  document.getElementById("period").textContent = "Period " + state.Period;
}

/* CLOCK */
function toggleClock(){
  state.Running = !state.Running;
  if(state.Running) start(); else stop();
  push("Running",state.Running);
  updateUI();
}

function start(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if(state.TimerSeconds>0){
      state.TimerSeconds--;
      document.getElementById("timer").textContent = formatTime(state.TimerSeconds);
      push("TimerSeconds",state.TimerSeconds);
    }
  },1000);
}

function stop(){
  clearInterval(timerInterval);
}

function setClock(){
  const v = prompt("MM:SS");
  if(!v) return;
  const [m,s]=v.split(":").map(Number);
  state.TimerSeconds=m*60+s;
  push("TimerSeconds",state.TimerSeconds);
  updateUI();
}

function setPeriod(){
  const v = parseInt(prompt("Period"));
  state.Period=v;
  push("Period",v);
  updateUI();
}

/* SCORE */
function updateScore(t,delta){
  const k = t==="A"?"teamAScore":"teamBScore";
  state[k]=Math.max(0,state[k]+delta);
  push(k,state[k]);
  updateUI();
}

function updateShots(t,delta){
  const k = t==="A"?"teamAShots":"teamBShots";
  state[k]=Math.max(0,state[k]+delta);
  push(k,state[k]);
  updateUI();
}

/* PUSH */
function push(field,value){
  fetch(`${SCRIPT_URL}?update=true&field=${field}&value=${value}`);
}

/* SETTINGS */
function openSettings(){
  document.getElementById("settingsModal").style.display="flex";
}

function closeSettings(){
  document.getElementById("settingsModal").style.display="none";
}

function handleDrop(team){
  const dd = document.getElementById("team"+team+"Dropdown");
  const input = document.getElementById("team"+team+"Custom");
  input.disabled = dd.value !== "__custom__";
}

async function updateTeams(){

  const A = document.getElementById("teamADropdown").value;
  const B = document.getElementById("teamBDropdown").value;

  state.teamAName = A;
  state.teamBName = B;

  push("teamAName",A);
  push("teamBName",B);

  updateUI();
  closeSettings();
}

/* UTIL */
function formatTime(s){
  const m=Math.floor(s/60);
  const r=s%60;
  return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`;
}

init();

</script>
</body>
</html>
