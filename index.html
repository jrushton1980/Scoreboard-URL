<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
:root {
  --font-team-name: 'Arial', sans-serif;
  --font-team-name-size: 22px;

  --font-shots: 'Arial', sans-serif;
  --font-shots-size: 16px;

  --font-score: 'Arial', sans-serif;
  --font-score-size: 40px;

  --font-vs-size: 32px;

  --font-period: 'Arial', sans-serif;
  --font-period-size: 16px;
}

body { 
  margin:0; padding:0; 
  font-family: var(--font-team-name); 
  background: transparent; 
  display:flex; flex-direction: column; align-items:center; 
}

.scoreboard-wrapper { 
  position: relative; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  margin-top:40px; 
}

.team-card { 
  display:flex; 
  align-items:center; 
  justify-content:space-between; 
  width:260px; 
  height:55px; 
  background: rgba(0,0,0,0.7);
  border-radius:15px; 
  padding:10px 15px; 
  z-index:1; 
  transition: all 0.2s ease;
}

.team-info { 
  display:flex; 
  flex-direction:column; 
  justify-content:center; 
  flex-grow:1; 
  margin-left:10px; 
}

.team-logo { 
  width:60px; 
  height:60px; 
  border-radius:50%; 
  object-fit:cover; 
  border:2px solid #fff; 
}

.team-name { 
  font-family: var(--font-team-name); 
  font-size: var(--font-team-name-size); 
  font-weight:bold; 
  color:#fff; 
  display:flex;
  align-items:center;
}

.shots { 
  font-family: var(--font-shots); 
  font-size: var(--font-shots-size); 
  color:#fff; 
}

.central-score { 
  position:absolute; 
  font-family: var(--font-score); 
  font-weight:bold; 
  font-size: var(--font-score-size); 
  background:rgba(0,0,0,0.7); 
  padding:15px 15px; 
  border-radius:20px; 
  box-shadow:0 0 20px rgba(0,0,0,0.5); 
  z-index:2; 
  display:flex; 
  flex-direction:column; 
  align-items:center; 
  justify-content:center; 
}

.score-row { 
  display:flex; 
  align-items:center; 
  justify-content:center; 
  color:#fff; 
}

.vs { 
  font-size: var(--font-vs-size); 
  margin:0 10px; 
  color:#fff; 
}

.period-clock { 
  font-family: var(--font-period); 
  font-size: var(--font-period-size); 
  font-weight:normal; 
  margin-top:5px; 
  color:#fff; 
}

#teamAcard { margin-right:70px; }
#teamBcard { margin-left:70px; }

/* PP STYLES */
.pp-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 6px;
  font-size: 12px;
  font-weight: bold;
  color: #000;
  background: #ffd400;
  border-radius: 4px;
}

.pp-active {
  outline: 2px solid #ffd400;
  box-shadow: 0 0 12px rgba(255, 212, 0, 0.5);
}
</style>
</head>

<body>
<div class="scoreboard-wrapper">

  <!-- TEAM A -->
  <div class="team-card" id="teamAcard">
    <img class="team-logo" id="teamALogo">
    <div class="team-info">
      <div class="team-name">
        <span id="teamAName"></span>
        <span id="teamAPP" class="pp-badge" style="display:none;">PP</span>
      </div>
      <div class="shots" id="teamAShots"></div>
    </div>
  </div>

  <!-- SCORE -->
  <div class="central-score">
    <div class="score-row">
      <span id="scoreA">0</span>
      <span class="vs">-</span>
      <span id="scoreB">0</span>
    </div>
    <div class="period-clock" id="periodClock">20:00 | Per 1</div>
  </div>

  <!-- TEAM B -->
  <div class="team-card" id="teamBcard">
    <img class="team-logo" id="teamBLogo">
    <div class="team-info">
      <div class="team-name">
        <span id="teamBName"></span>
        <span id="teamBPP" class="pp-badge" style="display:none;">PP</span>
      </div>
      <div class="shots" id="teamBShots"></div>
    </div>
  </div>

</div>

<script>
const DATA_URL = "https://script.google.com/macros/s/AKfycbyD8EO--akOZZZNKGOEHk4mpc4Gk-1WXbiHyvVIOaSmxI5f20Wiwwh7XIyEc4TaOlxD/exec";

let timerSeconds = 20 * 60;
let running = false;
let period = 1;
let lastRunningState = null;

// PP STATE
let teamA_pp = false;
let teamB_pp = false;

async function refresh() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    const data = await res.json();

    // TEAM A
    document.getElementById("teamALogo").src = data.teamALogo;
    document.getElementById("teamAName").innerText = data.teamAName;
    document.getElementById("teamAShots").innerText = `Shots: ${data.teamAShots}`;
    document.getElementById("teamAcard").style.backgroundColor = data.teamAColor + "33";

    // TEAM B
    document.getElementById("teamBLogo").src = data.teamBLogo;
    document.getElementById("teamBName").innerText = data.teamBName;
    document.getElementById("teamBShots").innerText = `Shots: ${data.teamBShots}`;
    document.getElementById("teamBcard").style.backgroundColor = data.teamBColor + "33";

    // SCORE
    document.getElementById("scoreA").innerText = data.teamAScore;
    document.getElementById("scoreB").innerText = data.teamBScore;

    // PP VALUES
    teamA_pp = data.teamA_pp === true || data.teamA_pp === "TRUE";
    teamB_pp = data.teamB_pp === true || data.teamB_pp === "TRUE";

    // APPLY PP UI
    document.getElementById("teamAPP").style.display = teamA_pp ? "inline-block" : "none";
    document.getElementById("teamBPP").style.display = teamB_pp ? "inline-block" : "none";

    document.getElementById("teamAcard").classList.toggle("pp-active", teamA_pp);
    document.getElementById("teamBcard").classList.toggle("pp-active", teamB_pp);

    // TIMER / PERIOD
    period = data.Period;
    const newRunning = data.Running === true || data.Running === "TRUE";

    const newTimerValue = parseInt(data.TimerSeconds) || 0;
    if (lastRunningState !== newRunning || !running) {
      timerSeconds = newTimerValue;
      updateClockDisplay();
    }

    running = newRunning;
    lastRunningState = newRunning;

  } catch (err) {
    console.error("Failed to fetch scoreboard data:", err);
  }
}

function updateClockDisplay() {
  if (timerSeconds < 0) timerSeconds = 0;
  const min = Math.floor(timerSeconds / 60);
  const sec = timerSeconds % 60;

  document.getElementById("periodClock").innerText =
    `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} | Per ${period}`;
}

setInterval(() => {
  if (running && timerSeconds > 0) {
    timerSeconds--;
    updateClockDisplay();
  }
}, 1000);

setInterval(refresh, 1500);
refresh();
</script>

</body>
</html>
